repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.4
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
- repo: local
  hooks:
    - id: pytest
      name: pytest
      # lmao what about linux))
      entry: .venv/Scripts/uv.exe run pytest
      language: system
      pass_filenames: false

