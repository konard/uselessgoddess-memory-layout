[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yacsp"
version = "0.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ponyawka" },
    { name = "uselessgoddes" },
]
dependencies = [
  "qasync>=0.28",
  "PyQt6>=6.6",
  "typing-extensions>=4.8",
  # --
  "PyAutoIt>=0.6",
  "pyautogui>=0.9",
  "pywin32>=311",
  # --
  "steamio",
  "uvicorn",
  "fastapi",
]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "ty>=0.0.1a23",
]

[tool.ruff]
target-version = "py311"

line-length = 80
# sorry bro :)
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# allow _unused variables
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
steamio = { git = "https://github.com/PONYAWKA/gc-handler", rev = "main" }
