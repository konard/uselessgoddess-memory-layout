name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cs2_helper/requirements.txt
      - name: Lint - black
        run: black --check cs2_helper
      - name: Type check - mypy
        run: mypy cs2_helper/src
      - name: Tests - pytest
        run: pytest -q cs2_helper/tests


